<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque da Pizzaria</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .add-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px #0001;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 18px;
      cursor: pointer;
    }

    .add {
      width: 100%;
      background: #16a34a;
      color: white;
    }

    .item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px #0001;
    }

    .item-name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .minus {
      background: #dc2626;
      color: white;
      width: 55px;
    }

    .plus {
      background: #16a34a;
      color: white;
      width: 55px;
    }

    .quantity {
      font-size: 25px;
      font-weight: bold;
      min-width: 70px;
      text-align: center;
    }

    .delete {
      background: #6b7280;
      color: white;
      margin-top: 10px;
      width: 100%;
      font-size: 15px;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>🍕 Estoque da Pizzaria</h1>
</header>

<div class="container">

  <div class="add-box">
    <input
      type="text"
      id="itemName"
      placeholder="Nome do produto"
    >

    <button class="add" onclick="adicionarItem()">
      + Adicionar produto
    </button>
  </div>

  <div id="lista"></div>

</div>

<script>
  let estoque = JSON.parse(localStorage.getItem("estoque")) || [];

  function salvar() {
    localStorage.setItem("estoque", JSON.stringify(estoque));
  }

  function adicionarItem() {
    const input = document.getElementById("itemName");
    const nome = input.value.trim();

    if (nome === "") {
      alert("Digite o nome do produto.");
      return;
    }

    estoque.push({
      nome: nome,
      quantidade: 0
    });

    salvar();

    input.value = "";

    mostrarEstoque();
  }

  function aumentar(index) {
    estoque[index].quantidade++;
    salvar();
    mostrarEstoque();
  }

  function diminuir(index) {
    if (estoque[index].quantidade > 0) {
      estoque[index].quantidade--;
      salvar();
      mostrarEstoque();
    }
  }

  function excluir(index) {
    if (confirm("Excluir este produto?")) {
      estoque.splice(index, 1);
      salvar();
      mostrarEstoque();
    }
  }

  function mostrarEstoque() {
    const lista = document.getElementById("lista");

    lista.innerHTML = "";

    if (estoque.length === 0) {
      lista.innerHTML = `
        <div class="empty">
          Nenhum produto cadastrado.
        </div>
      `;
      return;
    }

    estoque.forEach((item, index) => {

      lista.innerHTML += `
        <div class="item">

          <div class="item-name">
            ${item.nome}
          </div>

          <div class="controls">

            <button
              class="minus"
              onclick="diminuir(${index})">
              −
            </button>

            <div class="quantity">
              ${item.quantidade}
            </div>

            <button
              class="plus"
              onclick="aumentar(${index})">
              +
            </button>

          </div>

          <button
            class="delete"
            onclick="excluir(${index})">
            Excluir produto
          </button>

        </div>
      `;
    });
  }

  mostrarEstoque();
</script>

</body>
</html>
